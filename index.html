<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="den-ease">
<title>den-ease mood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e4;--card:#fffcf6;--ink:#2a251d;--mute:#6b6354;--line:#e4dccb;--g:#285240;--gs:#dfe9d6;--b:#a5483c;--bs:#f4ddd4;--r:20px;--chip:#f2ecdf;--tile:#ece3d1}
[data-theme=dark]{--bg:#121816;--card:#1b2420;--ink:#e6eeea;--mute:#7f8d87;--line:#27332e;--g:#6fb596;--gs:#1f3a30;--b:#e08a80;--bs:#3a2421;--chip:#26312c;--tile:#25302b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);min-height:100vh;color:var(--ink);font:500 15px/1.4 "Quicksand","Segoe UI",system-ui,sans-serif;padding-bottom:110px}
main{max-width:520px;margin:0 auto;padding:20px 16px}
h1{font-size:20px;font-weight:600;margin:6px 0 14px;text-align:center}
h2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--mute)}
.card{background:var(--card);border-radius:22px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 2px rgba(40,60,50,.06),0 12px 26px -18px rgba(40,60,50,.28)}
[data-theme=dark] .card{box-shadow:0 12px 30px -18px rgba(0,0,0,.7)}
[data-theme=dark] .tg:not(.on){opacity:1;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t{font-weight:600}.s{color:var(--mute);font-size:13.5px}
button,select,textarea,input{font:inherit;color:inherit}
input,textarea,select{font-size:16px} /* iPhone Safari zooms into anything smaller than 16px */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%} /* no double-tap zoom */
.ib{width:38px;height:44px;border-radius:10px;border:0;background:var(--g);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
[data-theme=dark] .ib{color:#10201a}
.ib svg{width:18px;height:18px}
.link{background:none;border:0;color:var(--g);cursor:pointer;padding:6px 0;font-weight:600}
.link.sm{font-size:13px;padding:2px 0}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
[data-theme=dark] .btn{color:#10201a}
.btn.soft{background:var(--card);color:var(--ink)}
textarea,select,input[type=text],input[type=time]{width:100%;background:var(--bg);border:0;border-radius:12px;padding:11px 12px;outline:none}
select,input[type=time]{width:auto}
textarea{min-height:76px;resize:vertical}
.hidden{display:none}
/* mood line */
.hi{font:400 26px/1 "Patrick Hand","Quicksand",cursive;color:var(--g);margin:-2px 0 6px 6px}
.moodhead{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.pct{font-size:44px;font-weight:400;letter-spacing:-.5px;font-variant-numeric:lining-nums;line-height:1;transition:color .2s}
.lwrap{padding:16px 0;margin:-6px 0 -2px;touch-action:none;cursor:ew-resize;-webkit-user-select:none;user-select:none}
#line{width:100%;height:auto;display:block;outline:none;overflow:visible;touch-action:none;pointer-events:none}
#line path{transition:filter .2s}
.hint{text-align:center;color:var(--mute);font-size:13px;margin-top:2px}
.sosbtn{display:flex;margin:0 auto 12px;padding:8px 18px;border:0;border-radius:20px;background:var(--card);color:var(--g);font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 8px 18px -12px rgba(33,81,61,.5)}
/* basics: ratings + period */
.rrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0}
.rrow>div:first-child{flex:1;min-width:0}
.rrow:first-child{padding-top:0}.rrow:last-child{padding-bottom:0}
.rl{font-weight:600}.rh{font-size:13px;color:var(--mute)}
.dots{display:flex;gap:7px;flex:none}
.rd{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--mute);border:1.6px solid color-mix(in srgb,var(--mute) 60%,transparent);background:none;cursor:pointer;padding:0;transition:transform .25s cubic-bezier(.3,1.7,.5,1),background .2s,border-color .2s}
.rd.on{transform:scale(1.1)}
.rd[data-n="1"].on{background:#d99a72;border-color:#d99a72}
.rd[data-n="2"].on{background:#d2b463;border-color:#d2b463}
.rd[data-n="3"].on{background:#a9c164;border-color:#a9c164}
.rd[data-n="4"].on{background:#6dbb86;border-color:#6dbb86}
.rd[data-n="5"].on{background:#2fa874;border-color:#2fa874}
.sw2{width:44px;height:24px;border-radius:12px;border:1.6px solid var(--mute);border:1.6px solid color-mix(in srgb,var(--mute) 60%,transparent);background:none;position:relative;cursor:pointer;padding:0;transition:all .2s;flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:all .2s}
.sw2.on{border-color:var(--b)}.sw2.on::after{left:23px;background:var(--b)}
/* tags */
.gt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tmore{align-items:center;margin-top:2px}
.tg{display:inline-flex;align-items:center;background:var(--chip);border:0;border-radius:11px;padding:4px 9px;font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer;user-select:none;transition:background .15s,color .15s}
.tg i{display:none}
.tg.pos{background:color-mix(in srgb,var(--g) 8%,var(--card));color:color-mix(in srgb,var(--g) 80%,var(--ink))}
.tg.neg{background:color-mix(in srgb,var(--b) 8%,var(--card));color:color-mix(in srgb,var(--b) 85%,var(--ink))}
.tg.on{background:color-mix(in srgb,var(--ink) 14%,var(--card));color:var(--ink);font-weight:600}
.tg.on.pos{background:color-mix(in srgb,var(--g) 24%,var(--card));color:var(--g)}
.tg.on.neg{background:color-mix(in srgb,var(--b) 22%,var(--card));color:var(--b)}
.tg.more{background:none;color:var(--mute);padding-left:4px;padding-right:4px}
/* basics tiles */
.basics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tl2{border-radius:20px;padding:14px 10px 12px;min-width:0;background:var(--tile);text-align:center;display:flex;flex-direction:column;align-items:center}
.tl2 svg.ti{width:28px;height:28px;display:block;margin-bottom:4px;fill:none;stroke:var(--g);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl2 .rl{font-size:15px;line-height:1.1;margin-bottom:9px}.tl2 .rc{font-size:12.5px;color:var(--mute);margin:9px 0 0;min-height:17px}
.tl2 .dots{gap:6px;justify-content:center}
.tl2 .rd,.tl2 .rd.on{width:15px;height:15px;transform:none;border:1.6px solid var(--g);background:none}
.tl2 .rd.on{background:var(--g)}
.ck{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.ck b{width:26px;height:26px;border-radius:8px;border:1.8px solid var(--g);display:grid;place-items:center;transition:background .15s}
.ck.on b{background:var(--g)}.ck.on b::before{content:"\2713";color:var(--card);font-size:13px;line-height:1}
.add{display:flex;gap:10px;align-items:center;margin-top:8px;width:100%}
.add input{flex:1;padding:6px 2px;border-radius:0;border-bottom:1px solid var(--line);background:none}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}
.sw.pos{background:var(--g)}.sw.neg{background:var(--b)}.sw.neu{background:var(--mute)}.sw.sel{outline:1.5px solid var(--ink);outline-offset:2px}
.er{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.er .dot{width:8px;height:8px;border-radius:50%;flex:none}
.er.pos .dot{background:var(--g)}.er.neg .dot{background:var(--b)}.er.neu .dot{background:var(--mute)}
.er>span:nth-child(2){flex:1}
.eb{display:flex;gap:4px}
.eb button{width:30px;height:28px;border:0;border-radius:9px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:12px}
/* note */
.note{background:none!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:6px 2px!important;min-height:36px;resize:none;overflow:hidden;font-size:16px;line-height:1.6;transition:border-color .2s}
.note:focus{border-bottom-color:var(--g)!important}
.note::placeholder{color:var(--mute);font-style:italic;opacity:.8}
/* keep button */
.keep{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 6px;padding:13px 30px;background:var(--g);color:#fff;border:0;border-radius:24px;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:transform .15s,background .25s,color .25s;touch-action:manipulation;-webkit-user-select:none;user-select:none;min-width:190px}
.keep:active{transform:scale(.96)}
[data-theme=dark] .keep{color:#10201a}
.keep.kept{background:var(--gs);color:var(--g);animation:pop .5s}
.keep.kept svg{stroke:var(--g)}
@keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1)}}
/* christmas-light blink: colour is the day's colour, strength follows the mood */
.lit{animation:twinkle .5s ease-in-out var(--blinks,2)}
.keep.kept.lit{animation:pop .5s,twinkle .5s ease-in-out var(--blinks,2)}
@keyframes twinkle{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 calc(6px + 26px*var(--li,.3)) calc(1px + 4px*var(--li,.3)) var(--lc,#6dbb86)}60%{box-shadow:0 0 2px 0 transparent}80%{box-shadow:0 0 calc(4px + 18px*var(--li,.3)) 0 var(--lc,#6dbb86)}}
.fsvg{display:block}
/* calendar: no boxes */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.dow{font-size:11px;color:var(--mute);padding-bottom:6px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:58px;cursor:pointer;gap:1px;position:relative}
.day .fsvg{width:36px;height:36px}
.day.placed .fsvg{opacity:.28}
.day.logged{touch-action:manipulation}
.day small{font-size:10px;color:var(--mute)}
.day.today small{color:var(--g);font-weight:700}
.pdot{width:5px;height:5px;border-radius:50%;background:var(--b);display:block;margin:0 auto}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.25) rotate(-6deg);filter:drop-shadow(0 6px 8px #0003)}
.board.over{outline:1.5px dashed var(--g);outline-offset:-6px}
.boardhint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 40px;color:var(--mute);font-size:13px;pointer-events:none}
.board{position:relative;height:380px;border-radius:16px;background:var(--bg);overflow:hidden;touch-action:none;margin-top:10px}
.stk{position:absolute;cursor:grab;user-select:none;transform:rotate(var(--rot));border-radius:50%;padding:2px}
.stk .fsvg{animation:xmas var(--dur,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes xmas{0%,100%{filter:drop-shadow(0 0 1px var(--lc,#6dbb86))}50%{filter:drop-shadow(0 0 calc(2px + 12px*var(--li,.2)) var(--lc,#6dbb86))}}
.bctl{display:flex;gap:6px;flex-wrap:wrap}
.bb{border:0;border-radius:14px;background:var(--bg);color:var(--ink);padding:6px 10px;cursor:pointer;display:grid;place-items:center}
.bb svg{width:18px;height:18px;display:block}
.bb.warn2{background:var(--b);color:#fff}
/* trends */
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg.top{background:var(--card);border-radius:16px;box-shadow:0 8px 18px -14px rgba(33,81,61,.45)}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
canvas{width:100%;height:200px;display:block}
ul.plain{padding-left:18px;margin:6px 0}
.q{border-left:2px solid var(--g);padding-left:10px;margin:6px 0;color:var(--mute);font-size:14px}
.warn{background:var(--gs);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px;margin:10px 0}
.warn label{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
/* hard-moment report */
.rc .face{display:flex;justify-content:center;margin-bottom:6px}
.rhead{text-align:center;margin-bottom:6px}
.rbig{font-size:28px;font-weight:600;line-height:1.15}
.chips{margin-top:8px}
.sech{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:600;margin:20px 0 6px}
.dr{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:9px 0;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
.dr:first-of-type{border-top:0}
.dr b{color:var(--ink)}
.dr span{color:var(--mute)}
.hl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:8px 0;align-items:center}
.hn{font-weight:600}
.hv{font-weight:700;color:var(--g);text-align:right;font-size:16px}
.hv small{display:block;color:var(--mute);font-weight:500;font-size:11.5px}
.hv.neg{color:var(--b)}
.hb i.neg{background:var(--b)}
.cf{font-size:11px;color:var(--mute);font-weight:500;margin-left:4px}
.seg.mini{margin:0;padding:2px}
.seg.mini button{padding:5px 10px;font-size:12.5px;flex:none}
.hb{grid-column:1/3;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.hb i{display:block;height:100%;border-radius:3px;background:var(--g)}
.qw{padding:0;list-style:none;counter-reset:q;margin:0}
.qw li{counter-increment:q;display:grid;grid-template-columns:28px 1fr;gap:1px 10px;padding:9px 0}
.qw li::before{content:counter(q);grid-row:1/3;width:26px;height:26px;border-radius:50%;background:var(--gs);color:var(--g);display:grid;place-items:center;font-weight:700;font-size:13px}
.qw li span{color:var(--mute);font-size:13.5px}
.sec{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:600}
/* date strip, toast, sparks */
.striprow{display:flex;align-items:center;gap:6px;position:relative;margin:-6px 0 10px}
.striprow .strip{flex:1;min-width:0;margin:0;padding:2px 0 6px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.calbtn{flex:none;position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--g);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px -10px rgba(33,81,61,.45)}
.calbtn svg{width:20px;height:20px;pointer-events:none}
.calbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;padding:0;margin:0;background:none}
.calbtn input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.sd{flex:none;width:48px;padding:6px 0 4px;border-radius:16px;border:1.5px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--mute)}
.sd.on{background:var(--card);border-color:transparent;box-shadow:0 1px 2px rgba(40,60,50,.08),0 8px 16px -10px rgba(40,60,50,.3);color:var(--ink)}
.sdw{font-size:10px;letter-spacing:.04em}.sdn{font-size:12px;font-weight:600}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);background:var(--ink);color:var(--card);padding:10px 20px;border-radius:22px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:70;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spark{position:fixed;border-radius:50%;pointer-events:none;z-index:60;transform:translate(-50%,-50%);animation:spark .85s ease-out forwards}
@keyframes spark{15%{opacity:1}40%{opacity:.35}55%{opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
/* timeline + legend */
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.tl{display:grid;grid-template-columns:136px 1fr;gap:10px;align-items:center;padding:7px 0}
.tln{display:flex;flex-direction:column;line-height:1.2;font-size:13px}
.tlt{position:relative;height:12px;background:var(--bg);border-radius:6px}
.tlb{position:absolute;top:0;height:100%;background:var(--b);border-radius:6px;opacity:.8}
.tlb.pos{background:var(--g)}
.tlax{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-left:146px}

.brand{text-align:center;font-size:24px;letter-spacing:.1em;color:var(--g);font-weight:600;margin:0 0 12px;line-height:1.1}
.brand span{letter-spacing:0;display:inline-block;transform:rotate(90deg);margin-left:4px}
.ctags{margin:8px 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cchip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:3px 9px 3px 12px;font-size:13px;font-weight:600;background:var(--bg);cursor:pointer}
.cchip b{font-size:11px;opacity:.7}
.cchip.pos{color:var(--g)}.cchip.neg{color:var(--b)}.cchip.neu{color:var(--ink)}
.cpick{display:flex;flex-wrap:wrap;gap:2px 12px;max-height:170px;overflow-y:auto;padding:8px 2px;margin-bottom:6px;border-top:1px solid var(--line)}
.pill{display:inline-block;padding:3px 11px;border-radius:14px;background:var(--gs);font-size:13px;margin:2px 3px 2px 0}
.nosave{background:#fff3d6;color:#5a4300;border-radius:18px;padding:12px 14px;font-size:13px;margin-bottom:12px}
[data-theme=dark] .nosave{background:#3a3016;color:#f1deb0}
#upd{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:90;max-width:92vw;border:0;border-radius:20px;padding:10px 18px;background:var(--g);color:#fff;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3)}
[data-theme=dark] #upd{color:#10201a}
.mrow{padding:10px 0;border-top:1px solid var(--line)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fx{display:flex;gap:4px}
.fxb{border:0;border-radius:12px;background:var(--bg);color:var(--ink);padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.fxb.on.fx1{background:var(--g);color:#fff}.fxb.on.fx0{background:var(--mute);color:#fff}.fxb.on.fx-1{background:var(--b);color:#fff}
[data-theme=dark] .fxb.on{color:#10201a}
.mf{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
.tile{background:var(--bg);border-radius:14px;padding:9px 4px;text-align:center}
.tile b{display:block;font-size:17px;line-height:1.2}
.tile span{font-size:11.5px;color:var(--mute)}
.sline{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}
.sline span{color:var(--mute)}
.fol{padding:6px 0;font-size:14px}
.bh{padding:8px 0}
.bhv{font-size:12.5px;color:var(--mute);margin:2px 0 4px}
.gg{color:var(--g);font-weight:700}.bb2{color:var(--b);font-weight:700}
.bar2{height:5px;border-radius:3px;background:var(--bg);overflow:hidden;margin-bottom:3px}
.bar2 i{display:block;height:100%;border-radius:3px}
.bar2 .gi{background:var(--g)}.bar2 .ri{background:var(--b)}
details.dr{display:block;padding:9px 0;border-top:1px solid var(--line)}
details.dr summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:104px 1fr;gap:10px;font-size:14px;line-height:1.45}
details.dr summary::-webkit-details-marker{display:none}
details.dr summary span{color:var(--mute)}
details.dr p{margin:6px 0 0 114px;font-size:13.5px;color:var(--mute);line-height:1.5}
.rsub{font-size:17px;margin-top:2px}
.pill.pos{background:var(--gs)}.pill.neg{background:var(--bs)}

function scrub(t){
 const map={};
 return t.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,"[email]").replace(/https?:\/\/\S+/g,"[link]")
  .replace(/\+?\d[\d\s().-]{7,}\d/g,"[number]").replace(/^\s*\[?\d{1,2}[\/.:]\d{1,2}[^\]\n]{0,25}\]?\s*/gm,"")
  .replace(/@\w+/g,"@someone").replace(/^([A-Z][\w ]{1,20}):\s/gm,(m,nm)=>{if(!map[nm])map[nm]="Speaker "+String.fromCharCode(65+Object.keys(map).length);return map[nm]+": "});
}
const FEELW=/\b(tired|exhausted|drained|annoyed|angry|furious|frustrated|irritated|sad|upset|hurt|anxious|worried|nervous|scared|afraid|lonely|alone|overwhelmed|stressed|pressured|burnt out|burned out|guilty|ashamed|embarrassed|hopeless|helpless|numb|empty|ignored|unappreciated|misunderstood|disappointed|confused|jealous|insecure|useless|worthless|happy|relieved|grateful|proud|excited|hopeful|calm|content|loved|supported)\b/gi;
function localRead(text){
 const feel={};(text.match(FEELW)||[]).forEach(function(w){w=w.toLowerCase();feel[w]=(feel[w]||0)+1});
 const sents=text.replace(/([.!?\n])\s+/g,"$1\u0001").split("\u0001").map(function(s){return s.replace(/^Speaker [A-Z]:\s*/,"").trim()}).filter(function(s){return s.length>=12&&s.length<=220});
 const score=function(s){return (s.match(FEELW)||[]).length*2+(/\b(can'?t|don'?t|never|always|nothing|too much|hate|wish|need)\b/i.test(s)?1:0)};

function momentStats(){

  if((x.f&&x.f.length)||x.fx!=null)s.k++;

// ---- the top third of days against the bottom third: what was more common on each ----
function bestHardHTML(){
 const el=entryList();
 if(el.length<12)return '<p class="s" style="margin:8px 0 0">Needs about 12 logged days to compare your best and hardest days. You have '+el.length+'.</p>';
 const ms=el.map(x=>x[1].mood).slice().sort((a,b)=>a-b),lo=ms[Math.floor(ms.length/3)],hi=ms[Math.ceil(ms.length*2/3)-1];
 const best=el.filter(([,e])=>e.mood>=hi),hard=el.filter(([,e])=>e.mood<=lo&&e.mood<hi);
 if(best.length<4||hard.length<4)return '<p class="s" style="margin:8px 0 0">Your days are too similar so far to split into best and hardest.</p>';
 const out=outcomeSet(),all={},nb=best.length,nh=hard.length;
 el.forEach(([d])=>dayNames(d).forEach(n=>{if(!out.has(n)&&CYCLE.indexOf(n)<0)all[n]=(all[n]||0)+1}));
 const rows=[];
 Object.keys(all).forEach(n=>{if(all[n]<5)return;
  const cb=best.filter(([d])=>dayNames(d).includes(n)).length,ch=hard.filter(([d])=>dayNames(d).includes(n)).length,pb=cb/nb,ph=ch/nh,pp=(cb+ch)/(nb+nh);
  const se=Math.sqrt(pp*(1-pp)*(1/nb+1/nh))||1;
  rows.push({n:n,pb:pb,ph:ph,d:pb-ph,z:(pb-ph)/se,ty:typeOf(n)})});
 // a bad thing never shows up as "more common on best days", and a good thing never as "more common on hard days"
 const up=rows.filter(r=>r.d>=.15&&r.z>=1.3&&r.ty!==B).sort((a,b)=>b.z-a.z).slice(0,5);
 const down=rows.filter(r=>r.d<=-.15&&r.z<=-1.3&&r.ty!==G).sort((a,b)=>a.z-b.z).slice(0,5);
 const row=r=>'<div class="bh"><div class="hn">'+esc(r.n)+'</div><div class="bhv"><span class="gg">'+Math.round(r.pb*100)+'%</span> of best \u00b7 <span class="bb2">'+Math.round(r.ph*100)+'%</span> of hard</div><div class="bar2"><i class="gi" style="width:'+Math.round(r.pb*100)+'%"></i></div><div class="bar2"><i class="ri" style="width:'+Math.round(r.ph*100)+'%"></i></div></div>';
 const lw=r=>esc(r.n.toLowerCase());
 let take="";
 if(up.length)take+="Your best days usually came with "+list(up.slice(0,2).map(lw))+". ";
 if(down.length)take+="Your hard days usually came with "+list(down.slice(0,2).map(lw))+".";
 return '<p class="s" style="margin:8px 0 0">Best days are your top third ('+hi+'% and up, '+nb+' days). Hard days are your bottom third ('+lo+'% and below, '+nh+' days).</p>'
  +(take?'<p class="wr" style="margin:10px 0 0">'+take+'</p>':'')
  +'<div class="sech">MORE COMMON ON YOUR BEST DAYS</div>'+(up.length?up.map(row).join(""):'<p class="s" style="margin:0">Nothing clear yet.</p>')
  +'<div class="sech">MORE COMMON ON YOUR HARD DAYS</div>'+(down.length?down.map(row).join(""):'<p class="s" style="margin:0">Nothing clear yet.</p>')
  +'<p class="s" style="margin:10px 0 0">Only differences that look real are shown, and only on the side that makes sense. Feelings are left out because they are the mood, and so is your cycle, which isn\'t something you can change. Patterns, not proof of cause.</p>';
}

function rangeInfo(){
 const t=new Date(),dow=(t.getDay()+6)%7;

 return{from,to};
}
// stressors = negative things that aren't feelings or habits; positives = good things that aren't feelings
const stressNames=(e,d)=>{const f=outcomeSet();return (d?dayNames(d):namesOf(e)).filter(n=>typeOf(n)===B&&!f.has(n)&&!HABITS.includes(n))};
const goodNames=(e,d)=>{const f=outcomeSet();return (d?dayNames(d):namesOf(e)).filter(n=>typeOf(n)===G&&!f.has(n)&&!HABITS.includes(n))};
function factorsInRange(fn){
 const {from,to}=rangeInfo(),c={};
 allDates().filter(d=>d>=from&&d<=to).forEach(d=>fn(S.entries[d],d).forEach(n=>c[n]=(c[n]||0)+1));
 return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}
// one row per factor (top 5, with a button for the rest); a bar for every stretch of days it was around
function timelineHTML(kind){
 const pos=kind==="pos",{from,to}=rangeInfo(),end=to<today()?to:today(),days=[];
 for(let d=from;d<=end;d=addDays(d,1))days.push(d);
 const total=Math.round((new Date(to)-new Date(from))/864e5)+1,all=factorsInRange(pos?goodNames:stressNames),rows=tlAll[kind]?all:all.slice(0,5);
 if(!rows.length)return `<p class="s" style="margin:0">${pos?"No positives logged in this range.":"Nothing logged in this range."}</p>`;
 const html=rows.map(([n,c])=>{
  const runs=[];let s=-1;
  days.forEach((d,i)=>{const on=dayNames(d).includes(n);
   if(on&&s<0)s=i;
   if(s>=0&&(!on||i===days.length-1)){const e=on?i:i-1;runs.push([s,e-s+1,e]);s=-1}});
  const last=runs[runs.length-1],now=last&&last[2]>=days.length-2?last[1]:0;
  return `<div class="tl"><div class="tln"><b>${esc(n)}</b><span class="s">${c} day${c>1?"s":""}${now>1?` \u00b7 ${now} in a row`:""}</span></div>
   <div class="tlt">${runs.map(([st,len])=>`<div class="tlb ${pos?"pos":""}" style="left:${st/total*100}%;width:max(${len/total*100}%,6px)"></div>`).join("")}</div></div>`}).join("");
 return html+`<div class="tlax"><span>${from.slice(5)}</span><span>${to.slice(5)}</span></div>`+(all.length>5?`<button class="link sm" data-tl="${kind}">${tlAll[kind]?"show top 5":"show all "+all.length}</button>`:"");
}function draw(){
 const c=$("#chart"),dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
 const {from,to}=rangeInfo(),span=(new Date(to)-new Date(from))/864e5||1;
 const pts=entryList().filter(([d,e])=>d>=from&&d<=to&&(!filterTag||dayNames(d).includes(filterTag)));
 const css=getComputedStyle(document.documentElement),mute=css.getPropertyValue("--mute").trim(),g=css.getPropertyValue("--g").trim(),line=css.getPropertyValue("--line").trim(),neg=css.getPropertyValue("--b").trim();
 const P=28,top=14,mb=H-96,bt=H-80,bb=H-22,mid=(bt+bb)/2,half=(bb-bt)/2,px=d=>P+((new Date(d)-new Date(from))/864e5/span)*(W-P-8),py=m=>mb-(m/100)*(mb-top);
 x.strokeStyle=line;x.fillStyle=mute;x.font="11px Quicksand,sans-serif";x.lineWidth=1;
 [0,50,100].forEach(v=>{x.beginPath();x.moveTo(P,py(v));x.lineTo(W,py(v));x.stroke();x.fillText(v,0,py(v)+4)});
 x.fillText(from.slice(5),P,H-4);x.fillText(to.slice(5),W-34,H-4);
 // bars: positives rise above the baseline, stressors drop below it
 const days=pts.map(([d,e])=>({d,m:e.mood,p:goodNames(e,d).length,n:stressNames(e,d).length})),mx=Math.max(3,...days.map(z=>Math.max(z.p,z.n))),bw=Math.max(3,Math.min(14,(W-P-8)/(span+1)*.6));
 x.beginPath();x.moveTo(P,mid);x.lineTo(W,mid);x.stroke();
 x.globalAlpha=isDark()?.5:.85;days.forEach(z=>{if(z.p){x.fillStyle=g;const h=z.p/mx*half;x.fillRect(px(z.d)-bw/2,mid-h,bw,h)}if(z.n){x.fillStyle=neg;const h=z.n/mx*half;x.fillRect(px(z.d)-bw/2,mid,bw,h)}});x.globalAlpha=1;

  x.fillStyle=g;pts.forEach(([d,e])=>{x.beginPath();x.arc(px(d),py(e.mood),range==="YTD"?2:4,0,7);x.fill()})}
 let msg=pts.length?`${pts.length} days · average ${avg(pts.map(p=>p[1].mood))}%${filterTag?` on days with "${filterTag}"`:""}`:"No data in this range";
 for(const th of[2,1]){const hi=days.filter(z=>z.n>=th),lo=days.filter(z=>z.n<th);

/* ---------- AI breakdown (testing build: calls the API straight from the browser with the user's own key) ---------- */
const AI_SYSTEM=`You help one person reflect on a private conversation so they can understand what they felt and explain it clearly in therapy.
Names were removed; speakers are labelled like "Speaker A". If one speaker is called "Me", that is the user. Otherwise assume the user is the speaker whose feelings come through most, and say that assumption in the overview.
Return ONLY a JSON object with exactly these keys:
{"overview":"2-3 warm, plain sentences on what this conversation was about for the user",
"feelings":[{"feeling":"one or two words","quote":"short verbatim quote from the text","note":"one short sentence on why you think so, hedged"}],
"triggers":[{"what":"what set it off or keeps pressing on them","quote":"short verbatim quote"}],
"patterns":["recurring thinking patterns or themes, only if the text supports them (e.g. self-criticism, avoiding conflict, people-pleasing)"],
"unspoken":["things the user may need or want but did not say, phrased as possibilities"],
"positives":["strengths, coping, caring moments you can see"],
"for_therapy":["2-4 short points the user could raise in therapy, written in first person"],
"themes":[{"label":"short label such as feeling not effective","quote":"verbatim sentence from the text"}]}
Rules: quote only words that appear in the text, each under 25 words, and never invent quotes. Stay in context: do not turn a joke, a quote of someone else, or a passing remark into a conclusion. Do not diagnose. If the text is too thin, say so and return fewer items. Keep the tone calm and friendly, not clinical. Use the user's own words for feelings where you can.`;
async function aiBreakdown(text){
 const send=(extra)=>fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.set.aikey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true",...(extra?{"anthropic-beta":"server-side-fallback-2026-07-01"}:{})},
  body:JSON.stringify({model:"claude-opus-5-5",max_tokens:4000,system:AI_SYSTEM,messages:[{role:"user",content:text}],...(extra?{fallbacks:"default"}:{})})});
 let r=await send(true);
 if(r.status===400)r=await send(false); // retry without the fallback option if the API rejects it
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error((j.error&&j.error.message)||("AI request failed ("+r.status+")"));
 if(j.stop_reason==="refusal")throw new Error("The AI declined to read this one. Try the simple summary instead.");
 const out=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
 const a=out.indexOf("{"),z=out.lastIndexOf("}");
 if(a<0||z<a)throw new Error("The AI reply wasn't readable. Try again.");
 return JSON.parse(out.slice(a,z+1));
}
function aiThemes(ai){const o={};(ai.themes||[]).forEach(t=>{if(t&&t.label&&t.quote)(o[String(t.label)]=o[String(t.label)]||[]).push(String(t.quote))});return o}
function aiHTML(a){
 const L=(h,items)=>items&&items.length?`<h2 style="margin-top:14px">${h}</h2>${items.join("")}`:"";
 const line=s=>`<div style="margin:5px 0">${esc(String(s))}</div>`;
 const q=(h,x)=>`<div style="margin:7px 0"><b>${esc(String(x[h]||""))}</b>${x.quote?`<div class="q">“${esc(String(x.quote))}”</div>`:""}${x.note?`<div class="s">${esc(String(x.note))}</div>`:""}</div>`;
 return `<p style="margin:10px 0 0">${esc(String(a.overview||""))}</p>`
  +L("What you seemed to feel",(a.feelings||[]).map(x=>q("feeling",x)))
  +L("What set it off",(a.triggers||[]).map(x=>q("what",x)))
  +L("Patterns",(a.patterns||[]).map(line))
  +L("What might be underneath",(a.unspoken||[]).map(line))
  +L("What's going okay",(a.positives||[]).map(line))
  +L("Worth bringing to therapy",(a.for_therapy||[]).map(line));
}

function pickUp(dayEl,ev){
 const date=dayEl.dataset.d,e=S.entries[date],b=$("#board");if(!e||S.memo[date])return;
 const ghost=document.createElement("div");ghost.className="ghost";ghost.innerHTML=faceFor(date,e.mood,40);document.body.appendChild(ghost);
 let x=ev.clientX,y=ev.clientY,live=true;
 const stopScroll=t=>t.preventDefault();document.addEventListener("touchmove",stopScroll,{passive:false});
 const over=()=>{const r=b.getBoundingClientRect();return x>r.left&&x<r.right&&y>r.top&&y<r.bottom};
 const tick=()=>{if(!live)return;ghost.style.left=x+"px";ghost.style.top=y+"px";b.classList.toggle("over",over());
  if(y>innerHeight-90)scrollBy(0,14);else if(y<90)scrollBy(0,-14);requestAnimationFrame(tick)};
 const move=m=>{x=m.clientX;y=m.clientY};
 const end=m=>{live=false;removeEventListener("pointermove",move);removeEventListener("pointerup",end);removeEventListener("pointercancel",end);
  document.removeEventListener("touchmove",stopScroll);ghost.remove();b.classList.remove("over");
  if(m.type==="pointerup"&&over()){const r=b.getBoundingClientRect();
   S.memo[date]={x:Math.max(0,Math.min(r.width-44,x-r.left-21)),y:Math.max(0,Math.min(r.height-44,y-r.top-21)),r:Math.round(Math.random()*30-15),s:1};memoSel=date;save();render()}};
 addEventListener("pointermove",move);addEventListener("pointerup",end);addEventListener("pointercancel",end);tick();
}
// tap a sticker: it hops and flashes. Height and glow follow its mood, so a bright day pops and a dull day barely stirs.
function boing(el){
 const d=el.dataset.d,e=S.entries[d];if(!e)return;const t=e.mood/100;
 el.style.setProperty("--bo",(5+Math.round(t*17))+"px");el.style.setProperty("--bg2",(3+Math.round(t*t*24))+"px");
 el.classList.remove("boing");void el.offsetWidth;el.classList.add("boing");
 clearTimeout(el.__bt);el.__bt=setTimeout(()=>el.classList.remove("boing"),760);
 toast(niceDate(d)+" \u00b7 "+e.mood+"%");
}
function drawBoard(){
 const b=$("#board"),keys=Object.keys(S.memo).filter(d=>S.entries[d]&&S.entries[d].mood!=null);
 if(keys.length){const h=$("#bh");if(h)h.remove()}
 keys.forEach(d=>{
  const p=S.memo[d],s=document.createElement("div");s.className="stk"+(memoSel===d?" sel":"");s.dataset.d=d;
  s.innerHTML=faceFor(d,S.entries[d].mood,stkSize(p));s.title=d;const tt=S.entries[d].mood/100;s.style.cssText=`left:${p.x}px;top:${p.y}px;--rot:${p.r}deg;--lc:${fcol(d,S.entries[d].mood)};--li:${(tt*tt).toFixed(2)};--dur:${(3.4-2.2*tt).toFixed(1)}s;--dl:-${(hashStr(d)%30)/10}s`;
  b.appendChild(s)});
 const ptrs=new Map();let drag=null,pinch=null,dirty=false;
 let pendDesel=false;
 const bz=document.createElement("div");bz.className="bsz";bz.innerHTML='<button data-z="-1" aria-label="smaller">\u2212</button><button data-z="1" aria-label="bigger">+</button>';b.appendChild(bz);
 bz.onpointerdown=ev=>ev.stopPropagation();bz.onpointerup=ev=>ev.stopPropagation();
 bz.onclick=ev=>{const z=ev.target.closest("button");if(!z||!memoSel||!S.memo[memoSel])return;const k=+z.dataset.z;setScale(memoSel,(S.memo[memoSel].s||1)*(k>0?1.25:.8));clearTimeout(window.__wt);window.__wt=setTimeout(save,300)};
 const mark=d=>{memoSel=d;bz.classList.toggle("on",!!d);b.querySelectorAll(".stk").forEach(x=>x.classList.toggle("sel",x.dataset.d===d))};
 bz.classList.toggle("on",!!memoSel);
 b.onpointerdown=ev=>{const st=ev.target.closest(".stk");
  try{b.setPointerCapture(ev.pointerId)}catch(e){}
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(st){mark(st.dataset.d)}else if(ptrs.size===1){pendDesel=true}else pendDesel=false;
  if(ptrs.size===1&&st){const p=S.memo[st.dataset.d];drag={el:st,p:p,ox:ev.clientX-p.x,oy:ev.clientY-p.y,id:ev.pointerId,moved:false,sx:ev.clientX,sy:ev.clientY}}
  else if(ptrs.size===2&&memoSel&&S.memo[memoSel]){drag=null;const v=[...ptrs.values()];pinch={d0:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1,s0:S.memo[memoSel].s||1}}};
 b.onpointermove=ev=>{if(!ptrs.has(ev.pointerId))return;ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&ptrs.size>=2){const v=[...ptrs.values()];setScale(memoSel,pinch.s0*Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)/pinch.d0);dirty=true}
  else if(drag&&ev.pointerId===drag.id){if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>5)drag.moved=true;const w=b.clientWidth,h=b.clientHeight,z=stkSize(drag.p)+6;
   drag.p.x=Math.max(0,Math.min(w-z,ev.clientX-drag.ox));drag.p.y=Math.max(0,Math.min(h-z,ev.clientY-drag.oy));drag.el.style.left=drag.p.x+"px";drag.el.style.top=drag.p.y+"px";dirty=true}};
 const up=ev=>{ptrs.delete(ev.pointerId);if(pendDesel&&ptrs.size===0){pendDesel=false;mark(null)}if(ptrs.size<2)pinch=null;if(drag&&ev.pointerId===drag.id){if(!drag.moved)boing(drag.el);drag=null}if(dirty&&ptrs.size===0){dirty=false;save()}};
 b.onpointerup=up;b.onpointercancel=up;
 b.addEventListener("wheel",ev=>{if(!memoSel||!S.memo[memoSel])return;ev.preventDefault();setScale(memoSel,(S.memo[memoSel].s||1)*(ev.deltaY<0?1.08:.92));dirty=true;clearTimeout(window.__wt);window.__wt=setTimeout(()=>{save();dirty=false},300)},{passive:false});

}

/* ---------- export ---------- */
function exportCSV(){
 const rows=[["date","mood_percent","sleep_1to5","water_1to5","meals_1to5","period","tags","note","moments"],...entryList().map(([d,e])=>[d,e.mood,e.sleep??"",e.water??"",e.food??"",e.period?"yes":"",(e.tags||[]).join("; "),(e.note||"").replace(/\s+/g," "),JSON.stringify(e.moments||{})])];
 const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="mood-export.csv";a.click();
}
function printReport(){
 const st=stressors(),w=window.open("");
 w.document.write(`<title>Report</title><body style="font-family:sans-serif;max-width:700px;margin:auto"><h1>Mood report ${today()}</h1><h2>Last 7 days</h2>${summaryFor(addDays(today(),-6),today(),"week")}<h2>Last 30 days</h2>${summaryFor(addDays(today(),-29),today(),"month")}<h2>Active stressors</h2><ul>${st.map(s=>`<li>${esc(s.tag)}: ${s.last14}/14 days, first logged ${s.first}</li>`).join("")}</ul><h2>Daily log</h2><table border=1 cellpadding=4 style="border-collapse:collapse"><tr><th>Date<th>Mood<th>Sleep<th>Water<th>Meals<th>Tags<th>Note</tr>${entryList().slice(-60).map(([d,e])=>`<tr><td>${d}<td>${e.mood}%<td>${e.sleep??""}<td>${e.water??""}<td>${e.food??""}<td>${esc(namesOf(e).join(", "))}<td>${esc(e.note||"")}`).join("")}</table>`);
 w.print();
}

/* ---------- updates ---------- */
const verNum=s=>String(s).split(" ")[0];
function showUpdate(v){
 if($("#upd"))return;const b=document.createElement("button");b.id="upd";b.textContent="A new version ("+v+") is ready. Tap to update.";
 b.onclick=applyUpdate;document.body.appendChild(b);
}
function applyUpdate(){
 const jobs=[];
 try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}))}catch(e){}
 try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}))}catch(e){}
 Promise.all(jobs).then(function(){location.reload()},function(){location.reload()});
}
// resolves true when a newer version exists on the server
function checkUpdate(manual){
 if(location.protocol.indexOf("http")!==0){if(manual)toast("Updates only work from the web address");return Promise.resolve(false)}
 if(manual)toast("Checking\u2026");
 return fetch("index.html?"+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
  const m=t.match(/const VERSION="([^"]*)"/),live=m?verNum(m[1]):null;
  if(live&&live!==verNum(VERSION)){showUpdate(live);return true}
  if(manual)toast("You're up to date \u00b7 "+verNum(VERSION));return false;
 }).catch(function(){if(manual)toast("Couldn't check. Are you online?");return false});
}
let lastUpd=0;
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&Date.now()-lastUpd>60000){lastUpd=Date.now();checkUpdate(false)}});

/* ---------- reminder + boot ---------- */
setInterval(()=>{const r=S.set.remind,n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
 if(r&&hm===r&&sget("lastRemind")!==today()&&window.Notification&&Notification.permission==="granted"){sset("lastRemind",today());new Notification("How are you today?")}},30000);
applyTheme();render();window.__easeOk=true;
try{if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){try{reg.update()}catch(e){}}).catch(function(){})}catch(e){}
lastUpd=Date.now();setTimeout(function(){checkUpdate(false)},1500);
</script>
